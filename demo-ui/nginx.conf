server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off;

    root /usr/share/nginx/html;
    index index.html;
    set $worker_upstream http://worker:8080;

    add_header X-Served-By "repoops-demo-ui" always;

    location /maintenance/ {
        proxy_pass $worker_upstream/maintenance/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /supervisor/ {
        proxy_pass $worker_upstream/supervisor/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /deployment/ {
        proxy_pass $worker_upstream/deployment/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"demo-ui"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
