services:
  worker:
    build:
      context: .
      dockerfile: src/RepoOps.Worker/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:${WORKER_HTTP_PORT}
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      RENOVATE_REPOSITORIES: ${RENOVATE_REPOSITORIES}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL}
      GITHUB_RECENT_MERGED_WINDOW_DAYS: ${GITHUB_RECENT_MERGED_WINDOW_DAYS}
      AUTOMERGE_ENABLED: ${AUTOMERGE_ENABLED}
      AUTOMERGE_DRY_RUN_ENABLED: ${AUTOMERGE_DRY_RUN_ENABLED}
      AUTOMERGE_ALLOWED_UPDATE_TYPES: ${AUTOMERGE_ALLOWED_UPDATE_TYPES}
      AUTOMERGE_ALLOWED_MERGEABLE_STATES: ${AUTOMERGE_ALLOWED_MERGEABLE_STATES}
      AUTOMERGE_MERGE_METHOD: ${AUTOMERGE_MERGE_METHOD}
      AUTOMERGE_POLICY_FILE_PATH: ${AUTOMERGE_POLICY_FILE_PATH}
      WORKER_HTTP_PORT: ${WORKER_HTTP_PORT}
      RepoOps__Worker__HttpPort: ${WORKER_HTTP_PORT}
      RepoOps__Worker__ExecutionTimeoutSeconds: ${WORKER_EXECUTION_TIMEOUT_SECONDS}
      RepoOps__Worker__InputSource: docker-compose
      RepoOps__Worker__EmitJsonToStdout: "false"
      RepoOps__Worker__ReportOutputPath: ${WORKER_REPORT_OUTPUT_PATH}
      RepoOps__Worker__SummaryTextOutputPath: ${WORKER_SUMMARY_TEXT_OUTPUT_PATH}
      RepoOps__Worker__SummaryHtmlOutputPath: ${WORKER_SUMMARY_HTML_OUTPUT_PATH}
      RepoOps__Worker__SupervisorOutputPath: ${WORKER_SUPERVISOR_OUTPUT_PATH}
      RepoOps__Worker__SupervisorDigestOutputPath: ${WORKER_SUPERVISOR_DIGEST_OUTPUT_PATH}
      RepoOps__Worker__SupervisorPromptOutputPath: ${WORKER_SUPERVISOR_PROMPT_OUTPUT_PATH}
      RepoOps__Worker__SupervisorPromptDigestOutputPath: ${WORKER_SUPERVISOR_PROMPT_DIGEST_OUTPUT_PATH}
      RepoOps__Codex__Mode: ${CODEX_EXECUTOR_MODE}
      RepoOps__Codex__OutputPath: ${CODEX_RESPONSE_OUTPUT_PATH}
      RepoOps__Codex__DigestOutputPath: ${CODEX_RESPONSE_DIGEST_OUTPUT_PATH}
      RepoOps__Validation__OutputPath: ${VALIDATION_OUTPUT_PATH}
      RepoOps__Validation__DigestOutputPath: ${VALIDATION_DIGEST_OUTPUT_PATH}
      RepoOps__Validation__InputResponsePath: ${VALIDATION_INPUT_RESPONSE_PATH}
      RepoOps__Validation__InputValidationPath: ${VALIDATION_INPUT_FILE_PATH}
      RepoOps__Validation__InteractiveMode: ${VALIDATION_INTERACTIVE_MODE}
      RepoOps__Commit__Enabled: ${COMMIT_ENGINE_ENABLED}
      RepoOps__Commit__AllowRealExecution: ${COMMIT_ENGINE_ALLOW_REAL_EXECUTION}
      RepoOps__Commit__DryRunEnabled: ${COMMIT_ENGINE_DRY_RUN_ENABLED}
      RepoOps__Commit__CreatePullRequest: ${COMMIT_ENGINE_CREATE_PULL_REQUEST}
      RepoOps__Commit__RequireCleanWorktree: ${COMMIT_ENGINE_REQUIRE_CLEAN_WORKTREE}
      RepoOps__Commit__OutputPath: ${COMMIT_ENGINE_OUTPUT_PATH}
      RepoOps__Commit__DigestOutputPath: ${COMMIT_ENGINE_DIGEST_OUTPUT_PATH}
      RepoOps__Commit__InputResponsePath: ${COMMIT_ENGINE_INPUT_RESPONSE_PATH}
      RepoOps__Commit__InputValidationPath: ${COMMIT_ENGINE_INPUT_VALIDATION_PATH}
      RepoOps__Commit__WorkspaceMapPath: ${COMMIT_ENGINE_WORKSPACE_MAP_PATH}
      RepoOps__Commit__BranchPrefix: ${COMMIT_ENGINE_BRANCH_PREFIX}
      RepoOps__Commit__PushRemote: ${COMMIT_ENGINE_PUSH_REMOTE}
      RepoOps__Commit__DefaultBaseBranch: ${COMMIT_ENGINE_DEFAULT_BASE_BRANCH}
    volumes:
      - ./reports:/app/reports
      - ./config:/app/config:ro
    expose:
      - "${WORKER_HTTP_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'RepoOps.Worker.dll' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - repo-ops

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - repo-ops

  n8n:
    image: docker.n8n.io/n8nio/n8n:1
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      GENERIC_TIMEZONE: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_EMAIL_MODE: smtp
      N8N_SMTP_HOST: ${SMTP_HOST}
      N8N_SMTP_PORT: ${SMTP_PORT}
      N8N_SMTP_USER: ${SMTP_USER}
      N8N_SMTP_PASS: ${SMTP_PASSWORD}
      N8N_SMTP_SENDER: ${SMTP_FROM}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      RENOVATE_REPOSITORIES: ${RENOVATE_REPOSITORIES}
    ports:
      - "127.0.0.1:${N8N_PORT}:${N8N_PORT}"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/files/workflows
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:' + (process.env.N8N_PORT || '5678') + '/healthz',
          (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - repo-ops

  renovate:
    image: renovate/renovate:39
    profiles:
      - maintenance
    restart: "no"
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      RENOVATE_CONFIG_FILE: /usr/src/app/config.js
      RENOVATE_BASE_DIR: /var/renovate
      RENOVATE_TOKEN: ${GITHUB_TOKEN}
      RENOVATE_GITHUB_COM_TOKEN: ${RENOVATE_GITHUB_COM_TOKEN}
      RENOVATE_DRY_RUN: ${RENOVATE_DRY_RUN}
      RENOVATE_REPOSITORIES: ${RENOVATE_REPOSITORIES}
      TZ: ${TZ}
    volumes:
      - ./renovate/config.js:/usr/src/app/config.js:ro
      - renovate-data:/var/renovate
    networks:
      - repo-ops

networks:
  repo-ops:
    name: repo-ops-network
    driver: bridge

volumes:
  postgres-data:
    name: repo-ops-postgres-data
  n8n-data:
    name: repo-ops-n8n-data
  renovate-data:
    name: repo-ops-renovate-data
