services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - repo-ops

  n8n:
    image: docker.n8n.io/n8nio/n8n:1
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      GENERIC_TIMEZONE: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_EMAIL_MODE: smtp
      N8N_SMTP_HOST: ${SMTP_HOST}
      N8N_SMTP_PORT: ${SMTP_PORT}
      N8N_SMTP_USER: ${SMTP_USER}
      N8N_SMTP_PASS: ${SMTP_PASSWORD}
      N8N_SMTP_SENDER: ${SMTP_FROM}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      RENOVATE_REPOSITORIES: ${RENOVATE_REPOSITORIES}
    ports:
      - "127.0.0.1:${N8N_PORT}:${N8N_PORT}"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/files/workflows
      - ./scripts:/files/scripts:ro
      - ./templates:/files/templates:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:' + (process.env.N8N_PORT || '5678') + '/healthz',
          (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - repo-ops

  renovate:
    image: renovate/renovate:39
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL}
      RENOVATE_CONFIG_FILE: /usr/src/app/config.js
      RENOVATE_BASE_DIR: /var/renovate
      RENOVATE_TOKEN: ${GITHUB_TOKEN}
      RENOVATE_GITHUB_COM_TOKEN: ${RENOVATE_GITHUB_COM_TOKEN}
      RENOVATE_DRY_RUN: ${RENOVATE_DRY_RUN}
      RENOVATE_REPOSITORIES: ${RENOVATE_REPOSITORIES}
      TZ: ${TZ}
    command:
      - /bin/sh
      - -lc
      - |
        echo "Renovate démarre en mode planifié"
        while true; do
          renovate
          sleep "${RENOVATE_INTERVAL_SECONDS:-86400}"
        done
    volumes:
      - ./renovate/config.js:/usr/src/app/config.js:ro
      - renovate-data:/var/renovate
    networks:
      - repo-ops

networks:
  repo-ops:
    name: repo-ops-network
    driver: bridge

volumes:
  postgres-data:
    name: repo-ops-postgres-data
  n8n-data:
    name: repo-ops-n8n-data
  renovate-data:
    name: repo-ops-renovate-data
